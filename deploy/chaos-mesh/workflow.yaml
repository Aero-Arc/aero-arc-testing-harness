apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: aero-arc-federation-recovery
  namespace: aero-arc-e2e
  labels:
    aero-arc.io/test-run: TEST_RUN_ID
spec:
  entry: federation-recovery
  templates:
    - name: federation-recovery
      templateType: Serial
      deadline: 180s
      children:
        - dss-latency
        - recovery-window
        - api-pod-kill
        - recovery-window
        - api-cpu-pressure

    - name: dss-latency
      templateType: NetworkChaos
      deadline: 20s
      networkChaos:
        action: delay
        mode: all
        direction: to
        selector:
          namespaces: [aero-arc-e2e]
          labelSelectors:
            app.kubernetes.io/name: aero-arc-api
            aero-arc.io/test-run: TEST_RUN_ID
        target:
          mode: all
          selector:
            namespaces: [aero-arc-e2e]
            labelSelectors:
              app.kubernetes.io/name: interuss-dss
              aero-arc.io/test-run: TEST_RUN_ID
        delay:
          latency: 750ms
          jitter: 100ms
          correlation: "75"

    - name: api-pod-kill
      templateType: PodChaos
      deadline: 20s
      podChaos:
        action: pod-kill
        mode: one
        selector:
          namespaces: [aero-arc-e2e]
          labelSelectors:
            app.kubernetes.io/name: aero-arc-api
            aero-arc.io/test-run: TEST_RUN_ID

    - name: api-cpu-pressure
      templateType: StressChaos
      deadline: 20s
      stressChaos:
        mode: one
        selector:
          namespaces: [aero-arc-e2e]
          labelSelectors:
            app.kubernetes.io/name: aero-arc-api
            aero-arc.io/test-run: TEST_RUN_ID
        stressors:
          cpu:
            workers: 2
            load: 85

    - name: recovery-window
      templateType: Suspend
      deadline: 10s
