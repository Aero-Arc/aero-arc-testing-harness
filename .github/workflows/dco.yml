name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signed-commits:
    name: Signed commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify DCO sign-offs
        env:
          DCO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-dco.sh "$DCO_BASE_SHA" "$DCO_HEAD_SHA"
